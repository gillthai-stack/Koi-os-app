name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx react-router typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npx prisma generate && npx prisma validate
        env:
          DATABASE_URL: postgresql://ci@localhost/ci
      - run: npm run build
