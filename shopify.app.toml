# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "KOI OS"
client_id = "c5ec59307e9e4b67989ee5893a5dc119"
application_url = "https://koi-os-app.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Read-only: KOI//OS never changes products, stock or orders in Shopify.
scopes = "read_products,read_inventory,read_orders,read_locations"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://koi-os-app.onrender.com/auth/callback", "https://koi-os-app.onrender.com/auth/shopify/callback", "https://koi-os-app.onrender.com/api/auth/callback" ]

[build]
automatically_update_urls_on_dev = false
