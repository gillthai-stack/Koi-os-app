# Render blueprint for KOI//OS. Secrets are set in the Render dashboard, never here.
services:
  - type: web
    name: koi-os-app
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm run setup && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products,read_inventory,read_orders,read_locations
      - key: DATABASE_URL
        sync: false
      - key: SHOP
        value: vaping-koi.myshopify.com
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_CODE
        generateValue: true
      # Customer requests: a Google service account key (JSON) that can read the request sheet.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Daily 9 AM out-of-stock digest email (optional). GMAIL_APP_PASSWORD is a Google app password
      # (myaccount.google.com/apppasswords) for GMAIL_USER. DIGEST_TO defaults to GMAIL_USER.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DIGEST_TO
        sync: false
